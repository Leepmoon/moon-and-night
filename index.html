
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>웹툰 보기</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100%;
  background: #111;
}

/* 웹툰 이미지 */
.webtoon {
  width: 100%;
  max-width: 800px;
  margin: 0 auto;
}

.webtoon img {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}

/* 배경음악 버튼 */
.music-btn {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 9999;

  padding: 12px 18px;
  border: 1px solid #777;
  border-radius: 30px;

  background: rgba(0, 0, 0, 0.75);
  color: white;

  font-size: 14px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.music-btn:hover {
  background: rgba(50, 50, 50, 0.9);
}
</style>
</head>

<body>

<!-- 웹툰 -->
<main class="webtoon" id="webtoon"></main>

<!-- 배경음악 -->
<audio
  id="bgm"
  src="bgm.mp3"
  loop
  preload="auto">
</audio>

<!-- 음악 버튼 -->
<button
  id="musicBtn"
  class="music-btn"
  type="button">
  🔇 BGM OFF
</button>

<script>

/* =====================
   웹툰 이미지 불러오기
===================== */

const viewer = document.getElementById("webtoon");

for (let i = 1; i <= 7; i++) {

  const img = document.createElement("img");

  // GitHub 파일: 1.png ~ 7.png
  img.src = i + ".png";

  img.alt = "웹툰 " + i;

  img.loading = i <= 2 ? "eager" : "lazy";

  viewer.appendChild(img);
}


/* =====================
   배경음악 설정
===================== */

const bgm = document.getElementById("bgm");
const musicBtn = document.getElementById("musicBtn");

// 기본 볼륨 30%
bgm.volume = 0.3;

// 사용자가 직접 음악을 끈 상태
let manuallyPaused = false;

// 버튼 상태 업데이트
function updateMusicButton() {
  musicBtn.textContent = bgm.paused
    ? "🔇 BGM OFF"
    : "🔊 BGM ON";
}

// 음악 재생
async function playMusic() {

  if (manuallyPaused || !bgm.paused) {
    return;
  }

  try {
    await bgm.play();
  } catch (error) {
    // 브라우저에서 자동 재생을 차단할 수 있음
    console.log("자동 재생 차단:", error);
  }

  updateMusicButton();
}

// 사이트 접속 시 자동 재생 시도
playMusic();

// 화면 처음 클릭/터치 시 재생
document.addEventListener(
  "pointerdown",
  () => {
    playMusic();
  },
  { once: true }
);

// 키보드 사용자 대응
document.addEventListener(
  "keydown",
  () => {
    playMusic();
  },
  { once: true }
);

// 음악 ON/OFF 버튼
musicBtn.addEventListener("click", async () => {

  if (bgm.paused) {

    manuallyPaused = false;
    await playMusic();

  } else {

    manuallyPaused = true;
    bgm.pause();
    updateMusicButton();

  }

});

// 음악 상태 자동 반영
bgm.addEventListener("play", updateMusicButton);
bgm.addEventListener("pause", updateMusicButton);

// 초기 버튼 표시
updateMusicButton();

</script>

</body>
</html>
