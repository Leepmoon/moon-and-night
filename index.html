
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>웹툰 보기</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #111;
}

.webtoon {
  width: 100%;
  max-width: 800px;
  margin: auto;
}

.webtoon img {
  display: block;
  width: 100%;
  height: auto;
}

/* 음악 버튼 */
.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  padding: 12px 18px;
  border: 1px solid #666;
  border-radius: 30px;
  background: rgba(0, 0, 0, 0.75);
  color: white;
  cursor: pointer;
  font-size: 14px;
}
</style>
</head>

<body>

<main class="webtoon" id="webtoon"></main>

<audio id="bgm" src="bgm.mp3"
       loop preload="auto"></audio>

<button id="musicBtn"
        class="music-btn"
        type="button">
  🔇 BGM OFF
</button>

<script>
const viewer = document.getElementById("webtoon");

for (let i = 1; i <= 6; i++) {
  const img = document.createElement("img");

  img.src = String(i).padStart(2, "0") + ".png";
  img.alt = "웹툰 " + i;
  img.loading = i <= 2 ? "eager" : "lazy";

  viewer.appendChild(img);
}

const bgm = document.getElementById("bgm");
const musicBtn = document.getElementById("musicBtn");

bgm.volume = 0.3;

let manuallyPaused = false;

function updateButton() {
  musicBtn.textContent = bgm.paused
    ? "🔇 BGM OFF"
    : "🔊 BGM ON";
}

async function startMusic() {
  if (manuallyPaused || !bgm.paused) return;

  try {
    await bgm.play();
  } catch (error) {
    // 브라우저가 자동 재생을 차단한 경우
    console.log("재생을 위해 사용자 동작 필요");
  }

  updateButton();
}

// 사이트 접속 시 자동 재생 시도
startMusic();

// 첫 클릭/터치 시 재생
document.addEventListener("pointerdown", () => {
  startMusic();
}, { once: true });

// 키보드로 조작하는 방문자 대응
document.addEventListener("keydown", () => {
  startMusic();
}, { once: true });

// 음악 버튼
musicBtn.addEventListener("click", async () => {
  if (bgm.paused) {
    manuallyPaused = false;
    await startMusic();
  } else {
    manuallyPaused = true;
    bgm.pause();
    updateButton();
  }
});

bgm.addEventListener("play", updateButton);
bgm.addEventListener("pause", updateButton);

updateButton();
</script>

</body>
</html>
